spring:
  datasource:
    # MySQL 주소
    url: jdbc:mysql://localhost:3306/word_tower?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    # MySQL 계정 아이디
    username: root
    # MySQL 계정 비밀번호
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # [추가] Hibernate가 테이블 구조를 먼저 확인/수정한 뒤에 SQL 파일을 실행하도록 설정
    defer-datasource-initialization: true
    hibernate:
      # 데이터를 삭제하지 않고 유지함
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # [추가] 초기 데이터 파일 실행 설정
  sql:
    init:
      # 서버를 켤 때마다 data.sql을 실행함 
      # (데이터가 이미 있으면 에러가 날 수 있으므로 data.sql 안의 쿼리를 INSERT IGNORE로 쓰는 게 좋습니다)
      mode: always